<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyGlass</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <aside>
        <div class="head-aside">
            <h1>SkyGlass</h1>
            <p>Local Weather</p>
        </div>

        <nav>
            <a href="index.html" class="actual_page">
                <i class="fa-brands fa-slack"></i>
                <span>DashBoard</span>
            </a>

            <a href="">
                <i class="fa-regular fa-calendar-days"></i>
                <span>Forecast</span>
            </a>
        
            <a href="">
                <i class="fa-regular fa-map"></i>
                <span>Radar Map</span>
            </a>
        
            <a href="">
                <i class="fa-solid fa-location-dot"></i>
                <span>Local Time</span>
            </a>    
        </nav>

    </aside>

    <main>
        <header>
            <div class="search_suggestion">
                <div class="div_search">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input id="input_city" type="text" placeholder="Search for cities...">
                </div>
                <div id="suggestions"></div>
            </div>


            <div class="div_header_right">

                <div class="div_header_icons">
                    <i class="fa-regular fa-bell"></i>
                    <i class="fa-solid fa-gear"></i>
                </div>

                <div class="div_header_user">
                    <h2>User</h2>
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>   

        </header>

        <div class="div_main_mid">
            <div class="div_location">

                <div class="div_city">
                    <i class="fa-solid fa-location-dot icon_city"></i>
                    <h1 class="h1_city" id="h1_city">LONDON, UK</h1>
                </div>

                <div class="div_temp">
                    <h2 id="temp">24°C</h2>
                    <div>
                        <h3 id="climate">Party Cloud</h3>
                        <p><span id="high_temp">H: 28</span> <span id="lower_temp">L: 19</span></p>
                    </div>
                </div>

            </div>
            <img src="" alt="weather icon" id="weather_icon">
        </div>  
        
        <div class="div_forecast">
            <h1>24-HOUR FORECAST</h1>
            <div class="all_cards_forecast">

                <div class="card_forecast">
                    <h2 id="forecast_1">Now</h2>
                    <img src="" alt="" id="forecast_1_img">
                    <h3 id="forecast_1_temp"></h3>
                </div>

                <div class="card_forecast">
                    <h2 id="forecast_2">Now</h2>
                    <img src="" alt="" id="forecast_2_img">
                    <h3 id="forecast_2_temp"></h3>
                </div>

                <div class="card_forecast">
                    <h2 id="forecast_3">Now</h2>
                    <img src="" alt="" id="forecast_3_img">
                    <h3 id="forecast_3_temp"></h3>
                </div>

                <div class="card_forecast">
                    <h2 id="forecast_4">Now</h2>
                    <img src="" alt="" id="forecast_4_img">
                    <h3 id="forecast_4_temp"></h3>
                </div>

                <div class="card_forecast">
                    <h2 id="forecast_5">Now</h2>
                    <img src="" alt="" id="forecast_5_img">
                    <h3 id="forecast_5_temp"></h3>
                </div>

            </div>

        </div>
        
        <div class="div_cards_climate">
            <div class="row_cards">
                <div class="card_climate">
                    <div>
                        <i class="fa-solid fa-temperature-half"></i>
                        <h2>FEELS LIKE</h2>
                    </div>
                    <h3 id="feels"></h3>
                </div>

                <div class="card_climate">
                    <div>
                        <i class="fa-solid fa-droplet"></i>
                        <h2>HUMIDITY</h2>
                    </div>
                    <h3 id="humidity"></h3>
                </div>

                <div class="card_climate">
                    <div>
                        <i class="fa-solid fa-wind"></i>
                        <h2>WIND</h2>
                    </div>
                    <h3 id="wind"></h3>
                </div>
            </div>

            <div class="row_cards">
                <div class="card_climate">
                    <div>
                        <i class="fa-solid fa-eye"></i>
                        <h2>VISIBILITY</h2>
                    </div>
                    <h3 id="visibility"></h3>
                </div>

                <div class="card_climate">
                    <div>
                        <i class="fa-solid fa-gauge-high"></i>
                        <h2>PRESSURE</h2>
                    </div>
                    <h3 id="pressure"></h3>
                </div>

                <div class="card_climate">
                <div>
                    <i class="fa-solid fa-water"></i>
                    <h2>SEA LEVEL</h2>
                </div>
                <h3 id="sea_level"></h3>
            </div>

        </div>
    </main>
</body>
<script src="script.js"></script>
</html>
